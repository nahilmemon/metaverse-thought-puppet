<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Metaverse Thought Puppet</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="m-4">
  <header>
    <h1>Submit Your Thoughts to the Metaverse</h1>
  </header>

  <main role="main" class="container-fluid p-0">
    <form id="submit-thought-form">
      <!-- Topic Dropdown -->
      <div class="form-group">
        <label for="topicDropdown">Select topic: </label>
        <select 
          id="topicDropdown" 
          class="form-control" 
          aria-describedby="topicDropdown" 
          placeholder="Select topic">
          <option>dreams</option>
          <option>woes</option>
          <option>love</option>
        </select>
      </div>
      <!-- Thought Input -->
      <div class="form-group">
        <label for="thoughtInput">Enter a thought on this topic: </label>
        <input 
          type="text" 
          id="thoughtInput" 
          class="form-control" 
          aria-describedby="thoughtInput" 
          placeholder="Enter thought">
      </div>
      
      <!-- Submit thought button -->
      <button type="button" id="submitThoughtButton" class="btn btn-primary">Submit Thought</button>
    </form>
  
    <section class="container">
      <h2>Message Feed</h2>
      <section id="feed"></section>
    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="app.js"></script>
</body>
</html>
